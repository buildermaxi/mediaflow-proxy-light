name: Publish

# Every merge to main publishes a fresh multi-arch image to ghcr, and the same
# Linux binaries as a GitHub release (for native installs, see deploy/).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# A newer merge supersedes an in-flight publish.
concurrency:
  group: publish
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux binaries (x86_64 + aarch64), consumed by the Docker image below
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Linux · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          # Native ARM runner — avoids cross-compiling entirely.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        # Default features include `tls-rustls` (pure-Rust TLS), so no system
        # OpenSSL is needed.  Each matrix entry runs on a native host.
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check glibc compatibility
        # The runner's glibc is newer than Debian 12's, so a dependency could
        # start requiring symbols that the distroless image (cc-debian12) and
        # Raspberry Pi OS Bookworm lack. Fail here rather than ship a binary
        # that won't start. Keep MAX_GLIBC in sync with deploy/install.sh.
        env:
          MAX_GLIBC: "2.36"
        run: |
          bin=target/${{ matrix.target }}/release/mediaflow-proxy-light
          needed=$(readelf -V --wide "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | cut -d_ -f2 | sort -uV | tail -n1)
          [[ -n $needed ]] || { echo "::error::no glibc symbol versions found in $bin"; exit 1; }
          echo "Highest glibc symbol version needed: $needed (max allowed: $MAX_GLIBC)"
          printf '%s\n' "$needed" "$MAX_GLIBC" | sort -V -C

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/mediaflow-proxy-light
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Docker multi-arch image — copies the binaries built above, so no Rust
  # toolchain and no QEMU Rust cross-compile in the image build.
  # ---------------------------------------------------------------------------
  build-docker:
    name: Docker multi-arch image
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - uses: actions/checkout@v5

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist

      # Lay out as dist/<TARGETARCH>/mediaflow-proxy-light for Dockerfile.prebuilt
      - name: Arrange binaries
        run: |
          for d in dist/bin-*; do mv "$d" "dist/${d#dist/bin-}"; done
          ls -lR dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # GitHub release with the same binaries, for native installs (systemd).
  # One release per merge, tagged v<Cargo version>-<short sha>; the newest is
  # "latest", which deploy/install.sh downloads from.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: build-binaries
    # A manual run from another branch must not publish a release.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist

      - name: Prepare assets
        run: |
          mkdir release
          for arch in amd64 arm64; do
            cp "dist/bin-$arch/mediaflow-proxy-light" "release/mediaflow-proxy-light-linux-$arch"
          done
          cp deploy/install.sh deploy/mediaflow-proxy-light.service release/
          cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="v${version}-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists (re-run on the same commit), skipping"
            exit 0
          fi
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            --latest

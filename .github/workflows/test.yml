name: Test

# PRs only: the merge to main would just re-run the exact same checks.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push to a PR cancels its still-running previous run.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  # ---------------------------------------------------------------------------
  # Lint + test (desktop / server)
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        # --test-threads=1 because a few config tests mutate global env vars and
        # race each other in parallel runs. All tests are offline.
        # Debug profile on purpose: the release profile (fat LTO, 1 codegen
        # unit) is much slower to build, and this reuses clippy's dep builds.
        run: cargo test -- --test-threads=1

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Audit unused dependencies
        run: cargo machete

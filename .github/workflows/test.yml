name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  # ---------------------------------------------------------------------------
  # Lint + test (desktop / server)
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        # --test-threads=1 because a few config tests mutate global env vars and
        # race each other in parallel runs.
        # Extractor tests are excluded here — they hit real upstream hosts
        # (Cloudflare / Turnstile-protected) and are run locally only.
        run: |
          cargo test --release --lib --bins -- --test-threads=1
          cargo test --release --test auth_tests --test config_tests -- --test-threads=1

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Audit unused dependencies
        run: cargo machete

[package]
name = "mediaflow-proxy-light"
version = "1.2.1"
edition = "2021"

# Ignore dependencies that cargo-machete flags but are legitimately behind
# disabled feature flags (detected when those features aren't in `default`).
[package.metadata.cargo-machete]
ignored = ["openssl"]

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
[features]
# The server keeps only what AIOStreams needs — `/proxy/ip`, `/generate_urls`,
# `/proxy/stream` — plus the dashboard, so the only build choice left is the
# TLS backend for `reqwest`. Exactly one must be enabled.
#
# `tls-rustls` (default) bundles Mozilla's CA list into the binary instead of
# probing the host filesystem, so the distroless image needs no CA bundle.
# `tls-native` uses the OS TLS stack (OpenSSL on Linux), which avoids rustls
# JA3/JA4 fingerprint blocks on a few Akamai-protected CDNs.
default = ["tls-rustls"]
tls-native = ["reqwest/native-tls"]
tls-rustls = ["reqwest/rustls-tls-webpki-roots"]

# Optional: vendored OpenSSL (only relevant when `tls-native` is used on
# platforms without a system OpenSSL, e.g. some cross-compiles).
vendored-openssl = ["openssl/vendored"]

# ---------------------------------------------------------------------------
# Lints
# ---------------------------------------------------------------------------
# A few configuration fields and helpers are library API that the binary
# doesn't call — allowing dead code crate-wide keeps warnings meaningful.
[lints.rust]
dead_code = "allow"

# URL building and streaming handlers legitimately need many arguments in a
# few places and we occasionally hold a RefCell borrow across an await when
# lock scope is fully controlled.  These pedantic lints are off crate-wide;
# real correctness lints stay on.
[lints.clippy]
too_many_arguments        = "allow"
await_holding_refcell_ref = "allow"
empty_line_after_doc_comments = "allow"

# ---------------------------------------------------------------------------
# Release profile — maximise performance
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# ---------------------------------------------------------------------------
# Core dependencies
# ---------------------------------------------------------------------------
[dependencies]
actix-web = "4.13"
actix-cors = "0.7"
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

# HTTP client — the TLS backend is selected by the `tls-native` /
# `tls-rustls` feature flags (see [features] above).
reqwest = { version = "0.12.28", default-features = false, features = ["stream", "json", "socks", "gzip", "deflate"] }

# Crypto — AES-CBC for proxy-URL encryption, HMAC-SHA256 for the dashboard
# session
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.9.3"
base64 = "0.22.1"

# Encoding / data
hex = "0.4"
url = "2.5"
urlencoding = "2.1"
regex = "1.12"
thiserror = "2.0"

# Configuration
config = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
dashmap = "6"

# Vendored OpenSSL (only needed for `tls-native` builds; prefer rustls)
openssl = { version = "0.10", features = ["vendored"], optional = true }

# Process CPU time (all unix) and RSS (macOS) for the web dashboard.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# ---------------------------------------------------------------------------
# Library / binary targets
# ---------------------------------------------------------------------------
[lib]
name = "mediaflow_proxy_light"
path = "src/lib.rs"

[[bin]]
name = "mediaflow-proxy-light"
path = "src/main.rs"

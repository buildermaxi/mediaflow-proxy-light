[package]
name = "mediaflow-proxy-light"
version = "2.0.0"
edition = "2021"

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
[features]
# The server keeps only what AIO Reborn needs — `/proxy/stream` (through
# `/_token_…/` URLs it mints) and `/proxy/ip` — plus the dashboard.
#
# `tls-rustls` (the only TLS backend) bundles Mozilla's CA list into the
# binary instead of probing the host filesystem, so the distroless image
# needs no CA bundle.
default = ["tls-rustls"]
tls-rustls = ["reqwest/rustls-tls-webpki-roots"]

# ---------------------------------------------------------------------------
# Lints
# ---------------------------------------------------------------------------
# A few configuration fields and helpers are library API that the binary
# doesn't call — allowing dead code crate-wide keeps warnings meaningful.
[lints.rust]
dead_code = "allow"

# URL building and streaming handlers legitimately need many arguments in a
# few places and we occasionally hold a RefCell borrow across an await when
# lock scope is fully controlled.  These pedantic lints are off crate-wide;
# real correctness lints stay on.
[lints.clippy]
too_many_arguments        = "allow"
await_holding_refcell_ref = "allow"
empty_line_after_doc_comments = "allow"

# ---------------------------------------------------------------------------
# Release profile — maximise performance
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# ---------------------------------------------------------------------------
# Core dependencies
# ---------------------------------------------------------------------------
[dependencies]
# No default features: the proxy streams already-compressed media and sits
# behind a reverse proxy speaking HTTP/1.1, so request/response compression
# (brotli, gzip, zstd), HTTP/2 and WebSockets are dead weight — and the code
# where most actix-http advisories live. Kept: the macros, cookies for the
# dashboard session, and unicode-aware routing.
actix-web = { version = "4.13", default-features = false, features = ["macros", "cookies", "unicode"] }
actix-cors = "0.7"
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

# HTTP client — TLS through the `tls-rustls` feature (see [features] above).
reqwest = { version = "0.12.28", default-features = false, features = ["stream", "json"] }

# Crypto — AES-256-GCM (key from HKDF-SHA256) for proxy-URL tokens,
# HMAC-SHA256 for the dashboard session
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9.3"
base64 = "0.22.1"

# Encoding / data
hex = "0.4"
url = "2.5"
urlencoding = "2.1"
thiserror = "2.0"

# Configuration
config = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
dashmap = "6"

# Process CPU time (all unix) and RSS (macOS) for the web dashboard.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# ---------------------------------------------------------------------------
# Library / binary targets
# ---------------------------------------------------------------------------
[lib]
name = "mediaflow_proxy_light"
path = "src/lib.rs"

[[bin]]
name = "mediaflow-proxy-light"
path = "src/main.rs"
